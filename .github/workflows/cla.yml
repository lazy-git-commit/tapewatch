name: CLA

# CLA Assistant Lite — a GitHub Action, not a third-party service.
# Signatures are stored in this repository's own git history (see
# path-to-signatures below), so there is no external dependency and no
# third-party processor holding contributor data.
#
# `branch:` below points at `cla-signatures`, NOT `main` — the action's own
# README says so explicitly ("branch should not be protected"). It writes a
# signature back via a direct Contents-API commit, which is a different
# credential path from an admin's `git push`: the default GITHUB_TOKEN this
# step runs with has no admin bypass, so a protected `main` rejects the write
# outright ("Changes must be made through a pull request. 3 of 3 required
# status checks are expected") — the read path had already been fixed by then
# (see the file-shape note in cla-signatures.json's history), so this was the
# second, independent half of the same underlying mismatch. `cla-signatures`
# carries no branch protection and exists only for this action to write to.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/lazy-git-commit/tapewatch/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: lazy-git-commit,dependabot[bot]
          custom-notsigned-prcomment: |
            Thank you for your contribution.

            Before this can be merged, please read our
            [Contributor Licence Agreement](https://github.com/lazy-git-commit/tapewatch/blob/main/CLA.md)
            and sign it by replying to this pull request with exactly:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            **You keep the copyright in your own work** — this is a licence, not
            an assignment. It exists so the project can continue to make
            licensing decisions about itself. You only ever do this once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
