apiVersion: 1

# The database name, user and password are read from the environment rather
# than committed. Grafana substitutes ${VAR} in provisioning files at load
# time; deploy/grafana.sh writes them into a systemd drop-in for
# grafana-server from the deployment secrets.

datasources:
  - name: trader-db
    uid: trader-postgres
    type: postgres
    access: proxy
    url: localhost:5432
    user: ${GF_TRADER_DB_USER}
    database: ${GF_TRADER_DB_NAME}
    isDefault: true
    jsonData:
      sslmode: disable
      postgresVersion: 1200
    secureJsonData:
      password: ${GF_TRADER_DB_PASSWORD}
    version: 1
    editable: false
