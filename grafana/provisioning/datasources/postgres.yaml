apiVersion: 1

# The database password is read from the environment, not stored here.
# Grafana substitutes ${VAR} in provisioning files at load time, so export
# GF_TRADER_DB_PASSWORD in Grafana's service environment before starting it.

datasources:
  - name: trader-db
    uid: trader-postgres
    type: postgres
    access: proxy
    url: localhost:5432
    user: trader
    database: momentum_trader
    isDefault: true
    jsonData:
      sslmode: disable
      postgresVersion: 1200
    secureJsonData:
      password: ${GF_TRADER_DB_PASSWORD}
    version: 1
    editable: false
