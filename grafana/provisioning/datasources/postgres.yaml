    uid: trader-postgres
    type: postgres
    access: proxy
    url: localhost:5432
    user: trader
    database: momentum_trader
    isDefault: true
    jsonData:
      sslmode: disable
      postgresVersion: 1200
    secureJsonData:
      password: ${GF_TRADER_DB_PASSWORD}
    version: 1
    editable: false
